workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - acceptance

compiler-runtime-acceptance:
  stage: acceptance
  tags: [nspawn]
  interruptible: true
  timeout: 3 hours
  variables:
    GIT_DEPTH: "0"
    RUSTFLAGS: "-Dwarnings"
    RUST_BACKTRACE: "1"
  script:
    - bash scripts/ci/gitlabAcceptance.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .ci-artifacts/
